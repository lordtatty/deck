version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - wrapcheck
    - nestif
    - testifylint
    - errname
    - thelper
    - noctx
    - gocyclo
  settings:
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
  exclusions:
    rules:
      - path: '_test\.go$'
        linters: [noctx]
